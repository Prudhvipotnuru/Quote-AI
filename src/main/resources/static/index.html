<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalmAI - Your 2-Min Relaxation Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>😌 QuoteAI</h1>
        <p class="subtitle">Tell me your mood, get a personalized quote</p>
        
        <form id="moodForm" th:action="@{/generateScript}" method="GET">
            <input type="text" name="mood" id="moodInput" placeholder="Want daily inspiration...">
            <button type="submit">Generate My Quote</button>
        </form>
        
        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>AI is creating your personal script...</p>
        </div>
        
        <div id="result" class="hidden"></div>
        
        <div class="stats">
            <span>Powered by Spring AI + GPT-4o-mini</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
